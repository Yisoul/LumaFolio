<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#32323a" />
      <stop offset="0.55" stop-color="#1b1b20" />
      <stop offset="1" stop-color="#101013" />
    </linearGradient>
    <linearGradient id="light" x1="0.1" y1="0.9" x2="0.9" y2="0.1">
      <stop offset="0" stop-color="#e08a1e" />
      <stop offset="1" stop-color="#f7cf7d" />
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#c9c9d4" />
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#bg)" />
  <rect x="2" y="2" width="1020" height="1020" rx="230" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4" />

  <!-- 光圈：外环 + 六片叶片，中间留出六边形开口 -->
  <circle cx="512" cy="512" r="232" fill="none" stroke="url(#rim)" stroke-width="52" />
  <g fill="none" stroke="url(#light)" stroke-width="34" stroke-linejoin="round" stroke-linecap="round">
    <polygon points="512,362 642,437 642,587 512,662 382,587 382,437" />
    <line x1="512" y1="362" x2="512" y2="306" />
    <line x1="642" y1="437" x2="690" y2="409" />
    <line x1="642" y1="587" x2="690" y2="615" />
    <line x1="512" y1="662" x2="512" y2="718" />
    <line x1="382" y1="587" x2="334" y2="615" />
    <line x1="382" y1="437" x2="334" y2="409" />
  </g>
</svg>
